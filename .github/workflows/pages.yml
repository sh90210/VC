name: Update scores and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # once an hour, at 17 minutes past
  workflow_dispatch: # lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live scores
        run: node scripts/update-data.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Fetch golf scores
        run: node scripts/update-golf.mjs

      - name: Number this build
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/" sw.js

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js data icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
